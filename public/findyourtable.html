<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Find Your Table">
    <meta name="theme-color" content="#2c3e50">
    <title>Find Your Table - Đại & Minh Wedding</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
    <meta name="description" content="Find your table seating arrangement for Minh & Đại's wedding on June 26, 2026.">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0SP0595MB5"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-0SP0595MB5');
    </script>

    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Nunito:wght@300;400;600;700&family=Dancing+Script:wght@700&display=swap&subset=vietnamese" rel="stylesheet">
    
    <style>
        /* Custom styles for Find Your Table button */
        .nav__link--cta {
            background: var(--accent-gold) !important;
            color: var(--bg-primary) !important;
            padding: var(--space-sm) var(--space-md) !important;
            white-space: nowrap;
        }

        .nav__link--cta:hover,
        .nav__link--cta:focus {
            background: #c9a130 !important;
            color: var(--bg-primary) !important;
        }

        /* Additional styles for table seating page */
        .tables-hero {
            min-height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            background-image: 
                linear-gradient(135deg, rgba(156, 175, 136, 0.05) 0%, rgba(168, 192, 212, 0.03) 50%, rgba(212, 175, 55, 0.02) 100%);
            text-align: center;
            padding: calc(80px + var(--space-2xl)) var(--space-md) var(--space-2xl);
            margin-top: 0;
            position: relative;
            overflow: hidden;
        }

        .tables-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .tables-hero__content {
            max-width: 700px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .tables-hero__title {
            font-family: 'Dancing Script', cursive;
            font-size: 5rem;
            margin-bottom: var(--space-xl);
            color: var(--accent-gold);
            line-height: 1.2;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.2);
        }

        .tables-hero__subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: var(--space-xl);
            font-weight: 300;
        }

        .search-section {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 var(--space-md);
        }

        .search-box {
            position: relative;
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.1));
        }

        .search-input {
            width: 100%;
            padding: var(--space-lg) var(--space-xl);
            padding-right: 60px;
            font-size: 1.125rem;
            border: 2px solid rgba(156, 175, 136, 0.2);
            border-radius: 50px;
            font-family: var(--font-sans);
            transition: all 0.3s ease;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .search-input::placeholder {
            color: var(--text-light);
            opacity: 0.7;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-sage);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1), 0 0 0 4px rgba(156, 175, 136, 0.1);
            transform: translateY(-2px);
        }

        .search-icon {
            position: absolute;
            right: var(--space-lg);
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 1.25rem;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .search-input:focus ~ .search-icon {
            color: var(--accent-sage);
            transform: translateY(-50%) scale(1.1);
        }

        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--space-xl);
            margin-bottom: var(--space-3xl);
        }

        .table-card {
            background: var(--bg-primary);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: var(--space-xl);
            transition: var(--transition);
            box-shadow: var(--shadow);
        }

        .table-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent-sage);
        }

        .table-card.highlighted {
            border-color: var(--accent-gold);
            background: linear-gradient(135deg, rgba(156, 175, 136, 0.1) 0%, rgba(212, 175, 55, 0.1) 100%);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.2);
        }

        .table-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-lg);
            padding-bottom: var(--space-md);
            border-bottom: 2px solid var(--border);
        }

        .table-number {
            font-family: var(--font-serif);
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .table-name {
            font-family: var(--font-serif);
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent-gold);
            text-align: right;
        }

        .guests-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .guest-item {
            padding: var(--space-sm) 0;
            color: var(--text-secondary);
            font-size: 1rem;
            border-bottom: 1px solid var(--bg-tertiary);
            transition: var(--transition);
        }

        .guest-item:last-child {
            border-bottom: none;
        }

        .guest-item.matched {
            color: var(--primary);
            font-weight: 600;
            padding-left: var(--space-md);
            border-left: 3px solid var(--accent-gold);
            background: rgba(212, 175, 55, 0.1);
            border-radius: 4px;
        }

        .no-results {
            text-align: center;
            padding: var(--space-3xl);
            color: var(--text-light);
            font-style: italic;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            margin-bottom: var(--space-lg);
        }

        .back-link:hover {
            color: var(--accent-sage);
            transform: translateX(-5px);
        }

        @media (max-width: 768px) {
            .tables-hero {
                min-height: 40vh;
                padding: calc(70px + var(--space-xl)) var(--space-md) var(--space-xl);
            }

            .tables-hero__title {
                font-size: 3rem;
                margin-bottom: var(--space-lg);
            }

            .search-section {
                padding: 0 var(--space-sm);
            }

            .search-input {
                font-size: 1rem;
                padding: var(--space-md) var(--space-lg);
                padding-right: 55px;
            }

            .search-icon {
                font-size: 1.125rem;
                right: var(--space-md);
            }

            .tables-grid {
                grid-template-columns: 1fr;
            }

            .table-header {
                flex-direction: column;
                align-items: flex-start;
                gap: var(--space-sm);
            }

            .table-name {
                text-align: left;
            }
        }

        @media (max-width: 480px) {
            .tables-hero {
                padding-top: calc(70px + var(--space-md));
            }

            .tables-hero__title {
                font-size: 2.5rem;
            }

            .search-input {
                padding: var(--space-sm) var(--space-md);
                padding-right: 50px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="nav" role="navigation" aria-label="Main navigation">
        <div class="nav__container">
            <a href="/" class="nav__logo">Đ & M</a>
            <button class="nav__toggle" aria-label="Toggle navigation menu">
                <span class="nav__hamburger"></span>
            </button>
            <ul class="nav__menu">
                <li><a href="/#story" class="nav__link">Our Story</a></li>
                <li><a href="/#schedule" class="nav__link">Schedule</a></li>
                <li><a href="/#venue" class="nav__link">Venue & Travel</a></li>
                <li><a href="/#rsvp" class="nav__link">RSVP</a></li>
            </ul>
            <div class="nav__controls">
                <button class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="tables-hero">
        <div class="tables-hero__content">
            <h1 class="tables-hero__title">Find Your Table</h1>
            <!-- Search Box -->
            <div class="search-section">
                <div class="search-box">
                    <input 
                        type="text" 
                        id="searchInput" 
                        class="search-input" 
                        placeholder="Enter your name to find your table..."
                        autocomplete="off"
                    >
                    <span class="search-icon">🔍</span>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <section class="section">
        <div class="container">
            

            <!-- Tables Grid -->
            <div id="tablesContainer" class="tables-grid">
                <!-- Tables will be dynamically loaded here -->
            </div>

            <!-- No Results Message -->
            <div id="noResults" class="no-results" style="display: none;">
                <p>No tables found. Please check your spelling or try a different name.</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Đại & Minh. Made with ❤️</p>
        </div>
    </footer>

    <script>
        // Theme Management (simplified from main.js)
        const ThemeManager = {
            init() {
                this.themeToggle = document.querySelector('.theme-toggle');
                this.loadTheme();
                this.themeToggle?.addEventListener('click', () => this.toggleTheme());
            },

            loadTheme() {
                const savedTheme = localStorage.getItem('theme');
                const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
                this.setTheme(theme);
            },

            setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                this.updateThemeToggle(theme);
            },

            toggleTheme() {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                this.setTheme(newTheme);
                localStorage.setItem('theme', newTheme);
            },

            updateThemeToggle(theme) {
                if (this.themeToggle) {
                    this.themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
                }
            }
        };

        // Navigation Management (simplified from main.js)
        const Navigation = {
            init() {
                this.navToggle = document.querySelector('.nav__toggle');
                this.navMenu = document.querySelector('.nav__menu');
                
                this.navToggle?.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.toggleMenu();
                });

                document.addEventListener('click', (e) => {
                    if (!document.querySelector('.nav')?.contains(e.target) && 
                        this.navMenu?.classList.contains('active')) {
                        this.closeMenu();
                    }
                });
            },

            toggleMenu() {
                this.navMenu?.classList.toggle('active');
            },

            closeMenu() {
                this.navMenu?.classList.remove('active');
            }
        };

        // Table Search Functionality
        let tablesData = [];

        async function loadTables() {
            try {
                const response = await fetch('tables.json');
                const data = await response.json();
                tablesData = data.tables;
                displayTables(tablesData);
            } catch (error) {
                console.error('Error loading tables:', error);
                document.getElementById('tablesContainer').innerHTML = 
                    '<p class="no-results">Unable to load table data. Please try again later.</p>';
            }
        }

        function displayTables(tables, searchTerm = '') {
            const container = document.getElementById('tablesContainer');
            const noResults = document.getElementById('noResults');
            
            if (tables.length === 0) {
                container.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }

            container.style.display = 'grid';
            noResults.style.display = 'none';
            
            container.innerHTML = tables.map(table => {
                const hasMatch = searchTerm && table.guests.some(guest => 
                    guest.toLowerCase().includes(searchTerm.toLowerCase())
                );
                
                return `
                    <div class="table-card ${hasMatch ? 'highlighted' : ''}">
                        <div class="table-header">
                            <div class="table-number">Table ${table.tableNumber}</div>
                            <div class="table-name">${table.tableName}</div>
                        </div>
                        <ul class="guests-list">
                            ${table.guests.map(guest => {
                                const isMatched = searchTerm && 
                                    guest.toLowerCase().includes(searchTerm.toLowerCase());
                                return `<li class="guest-item ${isMatched ? 'matched' : ''}">${guest}</li>`;
                            }).join('')}
                        </ul>
                    </div>
                `;
            }).join('');
        }

        function searchTables(searchTerm) {
            if (!searchTerm.trim()) {
                displayTables(tablesData);
                return;
            }

            const filteredTables = tablesData.filter(table => 
                table.guests.some(guest => 
                    guest.toLowerCase().includes(searchTerm.toLowerCase())
                ) || 
                table.tableName.toLowerCase().includes(searchTerm.toLowerCase())
            );

            displayTables(filteredTables, searchTerm);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            ThemeManager.init();
            Navigation.init();
            loadTables();

            // Setup search with debounce
            const searchInput = document.getElementById('searchInput');
            let debounceTimer;
            
            searchInput.addEventListener('input', (e) => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    searchTables(e.target.value);
                }, 300);
            });

            // Focus search input on load
            searchInput.focus();
        });
    </script>
</body>
</html>
