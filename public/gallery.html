<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a252f">
    <title>The Roll · Đại & Minh Wedding</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Nunito:wght@300;400;600;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --neptune-navy: #1a252f;
            --primary: #2c3e50;
            --dusty-blue: #7fb3d3;
            --sage: #9caf88;
            --gold: #d4af37;
            --cream: #f8f6f3;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', sans-serif;
            background:
                radial-gradient(circle at 30% 0%, #2c3e50 0%, transparent 60%),
                radial-gradient(circle at 70% 100%, #455566 0%, transparent 60%),
                #1a252f;
            color: var(--cream);
            min-height: 100vh;
        }
        h1, h2, h3 { font-family: 'Playfair Display', serif; font-weight: 500; }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        .topbar a {
            color: var(--cream);
            text-decoration: none;
            font-size: 0.85rem;
            opacity: 0.7;
        }
        .topbar a:hover { opacity: 1; }
        .topbar__title {
            font-family: 'Playfair Display', serif;
            font-size: 1.05rem;
            color: var(--gold);
            letter-spacing: 0.1em;
        }

        /* ─── Header ──────────────────────────────── */
        .header {
            text-align: center;
            padding: 40px 24px 24px;
        }
        .header__eyebrow {
            font-family: 'Special Elite', monospace;
            font-size: 0.8rem;
            letter-spacing: 0.3em;
            color: var(--gold);
            text-transform: uppercase;
        }
        .header h1 {
            font-size: clamp(2rem, 6vw, 3rem);
            margin: 8px 0 6px;
        }
        .header p { opacity: 0.7; font-size: 1rem; }
        .header__cta {
            display: inline-block;
            margin-top: 18px;
            padding: 10px 22px;
            background: var(--gold);
            color: var(--neptune-navy);
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
        }

        /* ─── Reveal countdown card ──────────────── */
        .reveal {
            max-width: 540px;
            margin: 24px auto;
            padding: 36px 28px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(212,175,55,0.25);
            border-radius: 16px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .reveal::before {
            content: '';
            position: absolute;
            inset: -50% -50%;
            background: radial-gradient(circle at center, rgba(212,175,55,0.07), transparent 60%);
            animation: pulse 6s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .reveal__icon { font-size: 3rem; }
        .reveal h2 {
            color: var(--gold);
            font-size: 1.6rem;
            margin: 12px 0 8px;
        }
        .reveal p { opacity: 0.85; line-height: 1.55; margin-bottom: 18px; }
        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 360px;
            margin: 16px auto 0;
            position: relative;
            z-index: 1;
        }
        .countdown__cell {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 10px 6px;
        }
        .countdown__num {
            font-family: 'Special Elite', monospace;
            font-size: 1.6rem;
            color: var(--gold);
        }
        .countdown__label {
            font-size: 0.65rem;
            opacity: 0.6;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        /* ─── Gallery grid ──────────────────────── */
        .gallery {
            max-width: 1200px;
            margin: 16px auto;
            padding: 0 16px 60px;
            column-count: 4;
            column-gap: 14px;
        }
        @media (max-width: 1024px) { .gallery { column-count: 3; } }
        @media (max-width: 700px) { .gallery { column-count: 2; column-gap: 10px; } }
        @media (max-width: 380px) { .gallery { column-count: 1; } }

        .polaroid {
            display: inline-block;
            width: 100%;
            margin: 0 0 14px;
            background: var(--cream);
            padding: 8px 8px 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.2s ease;
            color: #2c3e50;
            break-inside: avoid;
            position: relative;
        }
        .polaroid:nth-child(3n) { transform: rotate(-0.6deg); }
        .polaroid:nth-child(3n+1) { transform: rotate(0.6deg); }
        .polaroid:nth-child(5n) { transform: rotate(0.3deg); }
        .polaroid:hover, .polaroid:focus-visible {
            transform: scale(1.03) rotate(0deg);
            outline: none;
            box-shadow: 0 14px 30px rgba(0,0,0,0.55);
            z-index: 2;
        }
        .polaroid img {
            display: block;
            width: 100%;
            height: auto;
            background: #ddd;
            border-radius: 1px;
        }
        .polaroid__caption {
            font-family: 'Special Elite', monospace;
            font-size: 0.78rem;
            color: #5a6c7d;
            padding: 8px 4px 0;
            text-align: center;
            line-height: 1.3;
        }
        .polaroid__author {
            display: block;
            font-size: 0.7rem;
            color: #95a5a6;
            margin-top: 2px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 24px;
            opacity: 0.6;
        }

        /* ─── Lightbox ────────────────────────── */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 2000;
            flex-direction: column;
        }
        .lightbox.show { display: flex; }
        .lightbox img {
            max-width: 95vw;
            max-height: 78vh;
            object-fit: contain;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }
        .lightbox__caption {
            color: var(--cream);
            margin-top: 14px;
            text-align: center;
            font-family: 'Special Elite', monospace;
            font-size: 0.95rem;
            max-width: 600px;
        }
        .lightbox__author {
            color: var(--gold);
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-top: 6px;
        }
        .lightbox__close {
            position: absolute;
            top: 16px; right: 20px;
            background: none;
            border: none;
            color: var(--cream);
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
        }
        .lightbox__nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--cream);
            width: 48px; height: 48px;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lightbox__nav:hover { background: rgba(255,255,255,0.2); }
        .lightbox__nav--prev { left: 20px; }
        .lightbox__nav--next { right: 20px; }

        .stats {
            text-align: center;
            font-size: 0.85rem;
            opacity: 0.6;
            margin: 0 0 20px;
            font-family: 'Special Elite', monospace;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="/">← Back</a>
        <div class="topbar__title">THE ROLL</div>
        <a href="/camera">📷 Take a shot</a>
    </div>

    <header class="header">
        <div class="header__eyebrow">Đ &amp; M · WEDDING ROLL</div>
        <h1 id="heroTitle">The Disposable Camera Album</h1>
        <p id="heroSubtitle">Loading...</p>
    </header>

    <main id="main">
        <!-- States rendered into here: countdown, empty, gallery -->
        <div class="empty-state" id="loadingState">Developing the film...</div>
    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
        <button class="lightbox__close" id="lbClose" aria-label="Close">×</button>
        <button class="lightbox__nav lightbox__nav--prev" id="lbPrev" aria-label="Previous">‹</button>
        <button class="lightbox__nav lightbox__nav--next" id="lbNext" aria-label="Next">›</button>
        <img id="lbImg" alt="">
        <div class="lightbox__caption" id="lbCaption"></div>
        <div class="lightbox__author" id="lbAuthor"></div>
    </div>

    <script>
    (() => {
        'use strict';

        const els = {
            main: document.getElementById('main'),
            loading: document.getElementById('loadingState'),
            heroSubtitle: document.getElementById('heroSubtitle'),
            heroTitle: document.getElementById('heroTitle'),
            lightbox: document.getElementById('lightbox'),
            lbImg: document.getElementById('lbImg'),
            lbCaption: document.getElementById('lbCaption'),
            lbAuthor: document.getElementById('lbAuthor'),
            lbClose: document.getElementById('lbClose'),
            lbPrev: document.getElementById('lbPrev'),
            lbNext: document.getElementById('lbNext')
        };

        let photos = [];
        let lightboxIdx = -1;

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function pad(n) { return String(n).padStart(2, '0'); }

        function renderCountdown(revealAt) {
            const target = new Date(revealAt).getTime();

            els.main.innerHTML = `
                <section class="reveal">
                    <div class="reveal__icon">🎞</div>
                    <h2>Photos developing...</h2>
                    <p>The roll is locked until our wedding day wraps. Come back after the celebration to see every angle, every laugh, every moment — captured by you.</p>
                    <div class="countdown" aria-live="polite">
                        <div class="countdown__cell"><div class="countdown__num" id="cdDays">--</div><div class="countdown__label">Days</div></div>
                        <div class="countdown__cell"><div class="countdown__num" id="cdHours">--</div><div class="countdown__label">Hours</div></div>
                        <div class="countdown__cell"><div class="countdown__num" id="cdMins">--</div><div class="countdown__label">Mins</div></div>
                        <div class="countdown__cell"><div class="countdown__num" id="cdSecs">--</div><div class="countdown__label">Secs</div></div>
                    </div>
                    <p style="margin-top:24px;font-size:0.9rem;">
                        <a href="/camera" style="color:var(--gold);text-decoration:none;font-weight:700;">📷 Add your shots to the roll →</a>
                    </p>
                </section>`;

            const dEl = document.getElementById('cdDays');
            const hEl = document.getElementById('cdHours');
            const mEl = document.getElementById('cdMins');
            const sEl = document.getElementById('cdSecs');

            function tick() {
                const ms = target - Date.now();
                if (ms <= 0) {
                    // Reveal time! Reload to fetch the actual photos.
                    location.reload();
                    return;
                }
                const total = Math.floor(ms / 1000);
                const days = Math.floor(total / 86400);
                const hours = Math.floor((total % 86400) / 3600);
                const mins = Math.floor((total % 3600) / 60);
                const secs = total % 60;
                dEl.textContent = pad(days);
                hEl.textContent = pad(hours);
                mEl.textContent = pad(mins);
                sEl.textContent = pad(secs);
            }
            tick();
            setInterval(tick, 1000);
        }

        function renderGallery(photoList) {
            if (!photoList.length) {
                els.main.innerHTML = `
                    <div class="empty-state">
                        <p style="font-size:1.1rem;">No photos yet 🎞</p>
                        <p style="margin-top:10px;"><a href="/camera" class="header__cta">Be the first to add a shot</a></p>
                    </div>`;
                return;
            }

            const stats = `<div class="stats">${photoList.length} shot${photoList.length === 1 ? '' : 's'} on the roll · ${new Set(photoList.map(p => p.photographer_name)).size} photographer${new Set(photoList.map(p => p.photographer_name)).size === 1 ? '' : 's'}</div>`;
            const grid = `<div class="gallery" id="galleryGrid">
                ${photoList.map((p, i) => `
                    <button class="polaroid" data-idx="${i}" aria-label="View photo by ${escapeHtml(p.photographer_name)}">
                        <img src="${escapeHtml(p.thumbnail_url || p.public_url)}" loading="lazy" alt="${escapeHtml(p.caption || 'Photo by ' + p.photographer_name)}" onerror="this.src='${escapeHtml(p.public_url)}'">
                        <div class="polaroid__caption">
                            ${p.caption ? escapeHtml(p.caption) : '&nbsp;'}
                            <span class="polaroid__author">— ${escapeHtml(p.photographer_name)}</span>
                        </div>
                    </button>`).join('')}
            </div>`;
            els.main.innerHTML = stats + grid;

            document.getElementById('galleryGrid').addEventListener('click', e => {
                const card = e.target.closest('.polaroid');
                if (!card) return;
                openLightbox(parseInt(card.dataset.idx, 10));
            });
        }

        // ─── Lightbox ──────────────────────────
        function openLightbox(idx) {
            if (idx < 0 || idx >= photos.length) return;
            lightboxIdx = idx;
            const p = photos[idx];
            els.lbImg.src = p.public_url;
            els.lbImg.alt = p.caption || `Photo by ${p.photographer_name}`;
            els.lbCaption.textContent = p.caption || '';
            els.lbAuthor.textContent = `— ${p.photographer_name}`;
            els.lightbox.classList.add('show');
            document.body.style.overflow = 'hidden';
        }
        function closeLightbox() {
            els.lightbox.classList.remove('show');
            document.body.style.overflow = '';
            els.lbImg.src = '';
        }
        function nav(delta) {
            const next = (lightboxIdx + delta + photos.length) % photos.length;
            openLightbox(next);
        }
        els.lbClose.addEventListener('click', closeLightbox);
        els.lightbox.addEventListener('click', e => { if (e.target === els.lightbox) closeLightbox(); });
        els.lbPrev.addEventListener('click', () => nav(-1));
        els.lbNext.addEventListener('click', () => nav(1));
        document.addEventListener('keydown', e => {
            if (!els.lightbox.classList.contains('show')) return;
            if (e.key === 'Escape') closeLightbox();
            else if (e.key === 'ArrowLeft') nav(-1);
            else if (e.key === 'ArrowRight') nav(1);
        });

        // ─── Bootstrap ─────────────────────────
        async function load() {
            try {
                const res = await fetch('/api/photos', { credentials: 'include' });
                if (!res.ok) throw new Error('Status ' + res.status);
                const data = await res.json();

                if (!data.revealed) {
                    els.heroTitle.textContent = 'Coming soon';
                    els.heroSubtitle.textContent = "Photos appear after the wedding's wrapped.";
                    renderCountdown(data.revealAt);
                    return;
                }

                photos = data.photos || [];
                els.heroTitle.textContent = 'The Disposable Camera Album';
                els.heroSubtitle.textContent = `Every shot, every angle, captured by ${new Set(photos.map(p => p.photographer_name)).size} of you.`;
                renderGallery(photos);
            } catch (e) {
                console.error(e);
                els.heroSubtitle.textContent = 'Could not load the gallery. Please try again later.';
                els.main.innerHTML = `<div class="empty-state">Failed to load photos. <a href="" onclick="location.reload();return false;" style="color:var(--gold);">Retry</a></div>`;
            }
        }

        load();
    })();
    </script>
</body>
</html>
