<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Minh & Đại Wedding</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neptune-navy: #2c3e50;
            --dusty-blue: #7fb3d3;
            --dusty-blue-light: #a8c0d4;
            --sage-green: #9caf88;
            --brass-gold: #d4af37;
            --cream: #f8f6f3;
            --soft-white: #fefefe;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, var(--cream) 0%, var(--soft-white) 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: var(--neptune-navy);
            color: var(--soft-white);
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(44, 62, 80, 0.2);
            position: relative;
        }

        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .logout-btn:hover {
            background: #c0392b;
            transform: scale(1.05);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--brass-gold);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .login-section {
            background: var(--soft-white);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin-bottom: 30px;
        }

        .login-section.hidden {
            display: none;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--neptune-navy);
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            max-width: 300px;
            padding: 12px 16px;
            border: 2px solid var(--dusty-blue-light);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--brass-gold);
        }

        .btn {
            background: var(--brass-gold);
            color: var(--neptune-navy);
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #c19b2b;
            transform: translateY(-2px);
        }

        .dashboard {
            display: none;
        }

        .dashboard.visible {
            display: block;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--soft-white);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            border-top: 4px solid var(--brass-gold);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--neptune-navy);
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--dusty-blue);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .rsvp-list {
            background: var(--soft-white);
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .rsvp-header {
            background: var(--dusty-blue);
            color: var(--soft-white);
            padding: 20px;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .rsvp-table {
            width: 100%;
            border-collapse: collapse;
        }

        .rsvp-table th,
        .rsvp-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .rsvp-table th {
            background: var(--cream);
            color: var(--neptune-navy);
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .rsvp-table tr:hover {
            background: rgba(127, 179, 211, 0.1);
        }

        .status-attending {
            color: var(--sage-green);
            font-weight: bold;
        }

        .status-not-attending {
            color: #e74c3c;
            font-weight: bold;
        }

        .guest-count {
            background: var(--brass-gold);
            color: var(--neptune-navy);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--dusty-blue);
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #c33;
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--sage-green);
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            transform: scale(1.1);
            background: #8fb070;
        }

        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .delete-btn:hover {
            background: #c0392b;
            transform: scale(1.05);
        }

        .delete-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }

        .guest-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .guest-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: var(--cream);
            border-radius: 6px;
            border-left: 3px solid var(--brass-gold);
        }

        .guest-name {
            font-weight: 500;
            color: var(--neptune-navy);
        }

        .guest-delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .guest-delete-btn:hover {
            background: #c0392b;
        }

        .guest-delete-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }
        
        /* Guest column styles */
        .guest-columns {
            width: 100%;
        }
        
        .guest-column {
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .guest-column h3 {
            position: sticky;
            top: 0;
            background: white;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .guest-column .guest-list {
            padding-top: 10px;
        }
        
        .guest-column .guest-item {
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Notification styles */
        .notification {
            padding: 12px 16px;
            margin-bottom: 16px;
            border-radius: 8px;
            font-weight: 500;
            animation: slideInDown 0.3s ease-out;
        }

        .notification.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .notification.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .notification.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        .notification.fade-out {
            animation: fadeOut 0.3s ease-out forwards;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .stats {
                grid-template-columns: 1fr 1fr;
            }
            
            .rsvp-table {
                font-size: 0.9rem;
            }
            
            .rsvp-table th,
            .rsvp-table td {
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Admin Dashboard</h1>
            <p>Minh & Đại Wedding RSVP Management</p>
        </div>

        <div class="login-section" id="loginSection">
            <h2 style="margin-bottom: 20px; color: var(--neptune-navy);">Admin Access Required</h2>
            <div class="form-group">
                <label for="password">Enter Password:</label>
                <input type="password" id="password" placeholder="Enter admin password">
            </div>
            <button class="btn" onclick="login()">Access Dashboard</button>
            <div id="loginError"></div>
        </div>

        <div class="dashboard" id="dashboard">
            <button class="logout-btn" onclick="logout()">Logout</button>
            
            <div class="stats" id="stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalRsvps">0</div>
                    <div class="stat-label">Total RSVPs</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="attending">0</div>
                    <div class="stat-label">Attending</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="notAttending">0</div>
                    <div class="stat-label">Not Attending</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalGuests">0</div>
                    <div class="stat-label">Total Guests</div>
                </div>
            </div>

            <div class="rsvp-list">
                <div class="rsvp-header">
                    Guest List Management
                </div>
                <div style="padding: 20px;">
                    <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
                        <input type="text" id="newGuestName" placeholder="Enter guest name" style="flex: 1; min-width: 200px; padding: 10px; border: 2px solid var(--dusty-blue-light); border-radius: 6px;">
                        <select id="guestSide" style="padding: 10px; border: 2px solid var(--dusty-blue-light); border-radius: 6px; background: white;">
                            <option value="mutual">Mutual Guest</option>
                            <option value="bride">Bride's Side</option>
                            <option value="groom">Groom's Side</option>
                        </select>
                        <button class="btn" onclick="addGuest()" id="addGuestBtn">Add Guest</button>
                    </div>
                    <div id="guestNotification" class="notification" style="display: none;"></div>
                    <div id="guestListContent">
                        <div class="loading">Loading guest list...</div>
                    </div>
                </div>
            </div>

            <div class="rsvp-list">
                <div class="rsvp-header">
                    RSVP Responses
                </div>
                <div id="rsvpContent">
                    <div class="loading">Loading RSVP data...</div>
                </div>
            </div>

            <div class="rsvp-list">
                <div class="rsvp-header">
                    Admin Activity Log
                </div>
                <div id="adminLogsContent" style="padding: 20px;">
                    <div class="loading">Loading admin logs...</div>
                </div>
            </div>
        </div>

        <button class="refresh-btn" onclick="loadRsvpData()" title="Refresh Data" style="display: none;" id="refreshBtn">
            ↻
        </button>
    </div>

    <script>
        const CONFIG = {
            // API endpoints
            loginEndpoint: '/api/auth/login',
            logoutEndpoint: '/api/auth/logout',
            verifyEndpoint: '/api/auth/verify',
            adminEndpoint: '/api/admin/rsvps',
            deleteEndpoint: '/api/admin/rsvp',
            guestsEndpoint: '/api/admin/guests',
            logsEndpoint: '/api/admin/logs'
        };

        // Store token in memory (not localStorage for better security)
        let authToken = null;

        // Helper function to make authenticated requests
        async function authenticatedFetch(url, options = {}) {
            // Add Authorization header with JWT token
            const headers = {
                'Content-Type': 'application/json',
                ...options.headers
            };
            
            // Token is automatically sent via HTTP-only cookie
            // But we also include it in Bearer token for compatibility
            if (authToken) {
                headers['Authorization'] = `Bearer ${authToken}`;
            }
            
            return fetch(url, {
                ...options,
                headers,
                credentials: 'include' // Include cookies
            });
        }

        // Notification functions
        function showGuestNotification(message, type = 'info') {
            const notification = document.getElementById('guestNotification');
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.style.display = 'block';
            
            // Auto-hide after 4 seconds
            setTimeout(() => {
                hideGuestNotification();
            }, 4000);
        }

        function hideGuestNotification() {
            const notification = document.getElementById('guestNotification');
            notification.classList.add('fade-out');
            
            setTimeout(() => {
                notification.style.display = 'none';
                notification.classList.remove('fade-out');
            }, 300);
        }

        async function addGuest() {
            const guestNameInput = document.getElementById('newGuestName');
            const guestName = guestNameInput.value.trim();
            const guestSide = document.getElementById('guestSide').value;
            const addBtn = document.getElementById('addGuestBtn');

            if (!guestName) {
                showGuestNotification('Please enter a guest name.', 'error');
                guestNameInput.focus();
                return;
            }

            // Disable button during request
            addBtn.disabled = true;
            addBtn.textContent = 'Adding...';

            try {
                const response = await authenticatedFetch(CONFIG.guestsEndpoint, {
                    method: 'POST',
                    body: JSON.stringify({
                        name: guestName,
                        side: guestSide
                    })
                });

                if (response.status === 401) {
                    showGuestNotification('Session expired. Please login again.', 'error');
                    logout();
                    return;
                }

                if (response.ok) {
                    const result = await response.json();
                    guestNameInput.value = ''; // Clear input
                    loadGuestList(); // Refresh the list
                    showGuestNotification(`Guest "${guestName}" has been added to the list.`, 'success');
                } else {
                    const error = await response.json();
                    showGuestNotification(`Failed to add guest: ${error.error || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                console.error('Add guest error:', error);
                showGuestNotification('Connection error. Please try again.', 'error');
            } finally {
                // Reset button state
                addBtn.disabled = false;
                addBtn.textContent = 'Add Guest';
            }
        }

        async function login() {
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            
            if (!password) {
                showError('Please enter a password', errorDiv);
                return;
            }

            try {
                // Attempt login with JWT authentication
                const response = await fetch(CONFIG.loginEndpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include', // Include cookies
                    body: JSON.stringify({ password })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    authToken = data.token; // Store token in memory
                    
                    // Hide login, show dashboard
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashboard').classList.add('visible');
                    document.getElementById('refreshBtn').style.display = 'block';
                    
                    // Load all data
                    await loadRsvpData();
                    await loadGuestList();
                    await loadAdminLogs();
                    
                    console.log('✅ Login successful');
                } else {
                    const error = await response.json();
                    showError(error.error || 'Invalid password. Please try again.', errorDiv);
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Connection error. Please try again.', errorDiv);
            }
        }
        
        async function logout() {
            try {
                await authenticatedFetch(CONFIG.logoutEndpoint, {
                    method: 'POST'
                });
            } catch (error) {
                console.error('Logout error:', error);
            } finally {
                // Clear token and redirect to login
                authToken = null;
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('dashboard').classList.remove('visible');
                document.getElementById('refreshBtn').style.display = 'none';
                document.getElementById('password').value = '';
            }
        }
        
        async function checkAuth() {
            try {
                const response = await authenticatedFetch(CONFIG.verifyEndpoint);
                if (response.ok) {
                    // Already authenticated, load dashboard
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashboard').classList.add('visible');
                    document.getElementById('refreshBtn').style.display = 'block';
                    
                    await loadRsvpData();
                    await loadGuestList();
                    await loadAdminLogs();
                }
            } catch (error) {
                // Not authenticated, show login
                console.log('Not authenticated');
            }
        }

        async function loadRsvpData() {
            try {
                const response = await authenticatedFetch(CONFIG.adminEndpoint);
                
                if (response.status === 401) {
                    logout();
                    return;
                }
                
                if (response.ok) {
                    const data = await response.json();
                    displayRsvpData(data);
                } else {
                    console.error('Failed to refresh data');
                }
            } catch (error) {
                console.error('Refresh error:', error);
            }
        }

        function displayRsvpData(data) {
            console.log('Received data:', data); // Debug log
            
            // Check if data exists
            if (!data) {
                console.error('No data received');
                document.getElementById('rsvpContent').innerHTML = '<div class="loading">Error: No data received</div>';
                return;
            }
            
            const rsvps = data.rsvps || [];
            console.log('RSVPs array:', rsvps); // Debug log
            
            // Update statistics
            const totalRsvps = rsvps.length;
            const attending = rsvps.filter(r => r.attending === 'yes').length;
            const notAttending = rsvps.filter(r => r.attending === 'no').length;
            const totalGuests = rsvps.filter(r => r.attending === 'yes').reduce((sum, r) => sum + (parseInt(r.guests) || 1), 0);

            document.getElementById('totalRsvps').textContent = totalRsvps;
            document.getElementById('attending').textContent = attending;
            document.getElementById('notAttending').textContent = notAttending;
            document.getElementById('totalGuests').textContent = totalGuests;

            // Display RSVP table
            const contentDiv = document.getElementById('rsvpContent');
            
            if (!contentDiv) {
                console.error('rsvpContent div not found');
                return;
            }
            
            if (rsvps.length === 0) {
                contentDiv.innerHTML = '<div class="loading">No RSVPs received yet.</div>';
                return;
            }

            const tableHTML = `
                <table class="rsvp-table">
                    <thead>
                        <tr>
                            <th>Name(s)</th>
                            <th>Phone</th>
                            <th>Status</th>
                            <th>Guests</th>
                            <th>Message</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rsvps.map(rsvp => `
                            <tr id="rsvp-${rsvp.id}">
                                <td><strong>${escapeHtml(rsvp.names || '')}</strong></td>
                                <td>${escapeHtml(rsvp.phone || '')}</td>
                                <td>
                                    <span class="${rsvp.attending === 'yes' ? 'status-attending' : 'status-not-attending'}">
                                        ${rsvp.attending === 'yes' ? '✓ Attending' : '✗ Not Attending'}
                                    </span>
                                </td>
                                <td>
                                    ${rsvp.attending === 'yes' ? `<span class="guest-count">${parseInt(rsvp.guests) || 1}</span>` : '-'}
                                </td>
                                <td>${rsvp.attending === 'yes' ? escapeHtml(rsvp.message || 'No message') : '-'}</td>
                                <td>${formatDate(rsvp.timestamp)}</td>
                                <td>
                                    <button class="delete-btn" onclick="deleteRsvp('${rsvp.id}', '${escapeHtml(rsvp.names || '')}')">
                                        Delete
                                    </button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            
            contentDiv.innerHTML = tableHTML;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function showError(message, container) {
            container.innerHTML = `<div class="error">${message}</div>`;
        }

        async function deleteRsvp(rsvpId, guestName) {
            // Double confirmation
            if (!confirm(`Are you sure you want to delete the RSVP for "${guestName}"? This action cannot be undone.`)) {
                return;
            }

            const deleteBtn = document.querySelector(`#rsvp-${rsvpId} .delete-btn`);
            if (!deleteBtn) return;

            // Show loading state
            deleteBtn.disabled = true;
            deleteBtn.textContent = 'Deleting...';

            try {
                const response = await authenticatedFetch(`${CONFIG.deleteEndpoint}/${rsvpId}`, {
                    method: 'DELETE'
                });

                if (response.status === 401) {
                    alert('Session expired. Please login again.');
                    logout();
                    return;
                }

                if (response.ok) {
                    const result = await response.json();
                    
                    // Remove the row from the table
                    const row = document.getElementById(`rsvp-${rsvpId}`);
                    if (row) {
                        row.style.transition = 'opacity 0.3s ease';
                        row.style.opacity = '0';
                        setTimeout(() => {
                            row.remove();
                            // Refresh the data to update statistics
                            loadRsvpData();
                        }, 300);
                    }

                    alert(`RSVP for "${guestName}" has been deleted successfully.`);
                } else {
                    const error = await response.json();
                    alert(`Failed to delete RSVP: ${error.error || 'Unknown error'}`);
                }
            } catch (error) {
                console.error('Delete error:', error);
                alert('Connection error. Please try again.');
            } finally {
                // Reset button state
                if (deleteBtn) {
                    deleteBtn.disabled = false;
                    deleteBtn.textContent = 'Delete';
                }
            }
        }

        async function loadGuestList() {
            try {
                // Load both guests and RSVPs to show status
                const [guestsResponse, rsvpsResponse] = await Promise.all([
                    authenticatedFetch(CONFIG.guestsEndpoint),
                    authenticatedFetch(CONFIG.adminEndpoint)
                ]);
                
                if (guestsResponse.status === 401 || rsvpsResponse.status === 401) {
                    logout();
                    return;
                }
                
                if (guestsResponse.ok && rsvpsResponse.ok) {
                    const guestsData = await guestsResponse.json();
                    const rsvpsData = await rsvpsResponse.json();
                    
                    // Create a map of guest names to their RSVP status
                    const rsvpMap = new Map();
                    (rsvpsData.rsvps || []).forEach(rsvp => {
                        const guestName = rsvp.names.toLowerCase();
                        rsvpMap.set(guestName, rsvp.attending);
                    });
                    
                    displayGuestList(guestsData.guests, rsvpMap);
                } else {
                    console.error('Failed to load guest list');
                    document.getElementById('guestListContent').innerHTML = '<div class="error">Failed to load guest list</div>';
                }
            } catch (error) {
                console.error('Guest list error:', error);
                document.getElementById('guestListContent').innerHTML = '<div class="error">Connection error</div>';
            }
        }

        function displayGuestList(guests, rsvpMap = new Map()) {
            const contentDiv = document.getElementById('guestListContent');
            
            if (guests.length === 0) {
                contentDiv.innerHTML = '<div class="loading">No guests in the list. Anyone can RSVP.</div>';
                return;
            }

            // Group guests by side
            const guestsBySide = {
                bride: guests.filter(g => g.side === 'bride'),
                groom: guests.filter(g => g.side === 'groom'),
                mutual: guests.filter(g => g.side === 'mutual' || !g.side)
            };

            const sideColors = {
                bride: '#e91e63',
                groom: '#2196f3',
                mutual: '#4caf50'
            };
            
            // Function to get emoji based on RSVP status
            function getStatusEmoji(guestName) {
                const status = rsvpMap.get(guestName.toLowerCase());
                if (!status) return '⏳'; // No response yet
                if (status === 'yes') return '✅'; // Attending
                if (status === 'no') return '❌'; // Not attending
                return '❓'; // Maybe or unknown
            }

            const guestHTML = `
                <div class="guest-columns" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px;">
                    <!-- Bride's Side Column -->
                    <div class="guest-column" style="background: #fff; border-radius: 8px; padding: 15px; border: 2px solid ${sideColors.bride};">
                        <h3 style="color: ${sideColors.bride}; margin: 0 0 15px 0; font-size: 1.1em;">Bride's Side</h3>
                        <div class="guest-list">
                            ${guestsBySide.bride.length > 0 ? guestsBySide.bride.map(guest => `
                                <div class="guest-item" style="margin-bottom: 10px; padding: 10px; background: #f9f9f9; border-radius: 4px; display: flex; justify-content: space-between; align-items: center;">
                                    <span class="guest-name">
                                        <span style="font-size: 1.2em; margin-right: 5px;">${getStatusEmoji(guest.name)}</span>
                                        ${escapeHtml(guest.name)}
                                    </span>
                                    <button class="guest-delete-btn" onclick="deleteGuest('${escapeHtml(guest.name)}')" style="padding: 5px 10px; font-size: 0.85em;">
                                        Remove
                                    </button>
                                </div>
                            `).join('') : '<div style="color: #999; text-align: center; padding: 20px;">No guests</div>'}
                        </div>
                    </div>

                    <!-- Groom's Side Column -->
                    <div class="guest-column" style="background: #fff; border-radius: 8px; padding: 15px; border: 2px solid ${sideColors.groom};">
                        <h3 style="color: ${sideColors.groom}; margin: 0 0 15px 0; font-size: 1.1em;">Groom's Side</h3>
                        <div class="guest-list">
                            ${guestsBySide.groom.length > 0 ? guestsBySide.groom.map(guest => `
                                <div class="guest-item" style="margin-bottom: 10px; padding: 10px; background: #f9f9f9; border-radius: 4px; display: flex; justify-content: space-between; align-items: center;">
                                    <span class="guest-name">
                                        <span style="font-size: 1.2em; margin-right: 5px;">${getStatusEmoji(guest.name)}</span>
                                        ${escapeHtml(guest.name)}
                                    </span>
                                    <button class="guest-delete-btn" onclick="deleteGuest('${escapeHtml(guest.name)}')" style="padding: 5px 10px; font-size: 0.85em;">
                                        Remove
                                    </button>
                                </div>
                            `).join('') : '<div style="color: #999; text-align: center; padding: 20px;">No guests</div>'}
                        </div>
                    </div>

                    <!-- Mutual Column -->
                    <div class="guest-column" style="background: #fff; border-radius: 8px; padding: 15px; border: 2px solid ${sideColors.mutual};">
                        <h3 style="color: ${sideColors.mutual}; margin: 0 0 15px 0; font-size: 1.1em;">Mutual Guests</h3>
                        <div class="guest-list">
                            ${guestsBySide.mutual.length > 0 ? guestsBySide.mutual.map(guest => `
                                <div class="guest-item" style="margin-bottom: 10px; padding: 10px; background: #f9f9f9; border-radius: 4px; display: flex; justify-content: space-between; align-items: center;">
                                    <span class="guest-name">
                                        <span style="font-size: 1.2em; margin-right: 5px;">${getStatusEmoji(guest.name)}</span>
                                        ${escapeHtml(guest.name)}
                                    </span>
                                    <button class="guest-delete-btn" onclick="deleteGuest('${escapeHtml(guest.name)}')" style="padding: 5px 10px; font-size: 0.85em;">
                                        Remove
                                    </button>
                                </div>
                            `).join('') : '<div style="color: #999; text-align: center; padding: 20px;">No guests</div>'}
                        </div>
                    </div>
                </div>
            `;
            
            contentDiv.innerHTML = `
                <div class="stats" style="margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;">
                    <div class="stat-card" style="padding: 15px;">
                        <div class="stat-number">${guests.length}</div>
                        <div class="stat-label">Total Guests</div>
                    </div>
                    <div class="stat-card" style="padding: 15px; border-left: 4px solid ${sideColors.bride};">
                        <div class="stat-number">${guestsBySide.bride.length}</div>
                        <div class="stat-label">Bride's Side</div>
                    </div>
                    <div class="stat-card" style="padding: 15px; border-left: 4px solid ${sideColors.groom};">
                        <div class="stat-number">${guestsBySide.groom.length}</div>
                        <div class="stat-label">Groom's Side</div>
                    </div>
                    <div class="stat-card" style="padding: 15px; border-left: 4px solid ${sideColors.mutual};">
                        <div class="stat-number">${guestsBySide.mutual.length}</div>
                        <div class="stat-label">Mutual</div>
                    </div>
                </div>
                <div style="background: #f0f0f0; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 0.9em; text-align: center;">
                    <span style="margin-right: 15px;">✅ Attending</span>
                    <span style="margin-right: 15px;">❌ Not Attending</span>
                    <span style="margin-right: 15px;">❓ Maybe</span>
                    <span>⏳ No Response</span>
                </div>
                ${guestHTML}
            `;
        }



        async function loadAdminLogs() {
            try {
                const response = await authenticatedFetch(CONFIG.logsEndpoint);
                
                if (response.status === 401) {
                    logout();
                    return;
                }
                
                if (response.ok) {
                    const data = await response.json();
                    displayAdminLogs(data.logs || []);
                } else {
                    console.error('Failed to load admin logs');
                    document.getElementById('adminLogsContent').innerHTML = '<div class="error">Failed to load admin logs</div>';
                }
            } catch (error) {
                console.error('Admin logs error:', error);
                document.getElementById('adminLogsContent').innerHTML = '<div class="error">Connection error loading logs</div>';
            }
        }

        function displayAdminLogs(logs) {
            const contentDiv = document.getElementById('adminLogsContent');
            
            if (logs.length === 0) {
                contentDiv.innerHTML = '<div class="loading">No admin activity logged yet.</div>';
                return;
            }

            const actionColors = {
                'view_rsvps': '#3498db',
                'delete_rsvp': '#e74c3c', 
                'add_guest': '#27ae60',
                'delete_guest': '#e67e22',
                'view_guests': '#9b59b6'
            };

            const logItems = logs.map((log, index) => {
                const date = new Date(log.created_at);
                const timeStr = date.toLocaleString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                
                const actionColor = actionColors[log.action] || '#7f8c8d';
                const actionText = log.action.replace('_', ' ');
                const details = escapeHtml(log.details || 'No details');
                const ipDiv = log.ip_address ? `<div style="font-size: 0.75em; color: #868e96; margin-top: 4px;">IP: ${log.ip_address}</div>` : '';
                
                return `
                    <div style="border-left: 4px solid ${actionColor}; padding: 12px; margin-bottom: 8px; background: #f8f9fa; border-radius: 0 6px 6px 0;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                            <span style="font-weight: bold; color: ${actionColor}; text-transform: uppercase; font-size: 0.85em;">
                                ${actionText}
                            </span>
                            <span style="font-size: 0.8em; color: #6c757d;">
                                ${timeStr}
                            </span>
                        </div>
                        <div style="color: #495057; font-size: 0.9em;">
                            ${details}
                        </div>
                        ${ipDiv}
                    </div>
                `;
            }).join('');

            const logsHTML = `
                <div style="max-height: 400px; overflow-y: auto;">
                    ${logItems}
                </div>
                <div style="margin-top: 16px; padding: 12px; background: #e9ecef; border-radius: 6px; text-align: center; font-size: 0.9em; color: #495057;">
                    📊 Total admin actions: ${logs.length}
                </div>
            `;
            
            contentDiv.innerHTML = logsHTML;
        }

        async function deleteGuest(guestName) {
            // Double confirmation
            if (!confirm(`Are you sure you want to remove "${guestName}" from the guest list? They will no longer be able to RSVP.`)) {
                return;
            }

            try {
                const response = await authenticatedFetch(`${CONFIG.guestsEndpoint}/${encodeURIComponent(guestName)}`, {
                    method: 'DELETE'
                });

                if (response.status === 401) {
                    showGuestNotification('Session expired. Please login again.', 'error');
                    logout();
                    return;
                }

                if (response.ok) {
                    loadGuestList(); // Refresh the list
                    showGuestNotification(`Guest "${guestName}" has been removed from the list.`, 'success');
                } else {
                    const error = await response.json();
                    showGuestNotification(`Failed to remove guest: ${error.error || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                console.error('Delete guest error:', error);
                showGuestNotification('Connection error. Please try again.', 'error');
            }
        }

        // Handle Enter key in password field
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });

        // Handle Enter key in guest name input field
        document.getElementById('newGuestName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addGuest();
            }
        });

        // Check if already authenticated on page load
        checkAuth();
    </script>
</body>
</html>
